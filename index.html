<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>]
    <link rel="stylesheet" href="style.css">
</head>
<body>
   <div class="class">
  <h2>Tic-Tac-Toe</h2>
  <h3 id="msg">Player X ki baari</h3>
</div>
  <div class="board">
    <button class="box" onclick="play(this, 0)"></button>
    <button class="box" onclick="play(this, 1)"></button>
    <button class="box" onclick="play(this, 2)"></button>
    <button class="box" onclick="play(this, 3)"></button>
    <button class="box" onclick="play(this, 4)"></button>
    <button class="box" onclick="play(this, 5)"></button>
    <button class="box" onclick="play(this, 6)"></button>
    <button class="box" onclick="play(this, 7)"></button>
    <button class="box" onclick="play(this, 8)"></button>
  </div>

  <button id="reset" onclick="location.reload()">Restart Game</button>
  <script src="script.js"></script>
</body>
</html>
